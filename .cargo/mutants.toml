# Configuration for cargo-mutants (https://mutants.rs)
# Measures mutation kill rate across the core parser logic in src/.

# Target source directories and files
# Exclude tests, benches, examples, and fuzz targets from mutation analysis
exclude_globs = [
    "benches/**",
    "examples/**",
    "fuzz/**",
    "tests/**",
    # Unit-test modules kept in their own files under src/: mutating a
    # test only measures whether the test still compiles.
    "src/**/tests.rs",
    "src/**/*_tests.rs",
]

# Exclude functions that are purely formatting, debugging, or vacuous fallbacks
exclude_re = [
    ".*::fmt",
    ".*::test_.*",
]

# Build and test with every feature, so code behind an optional
# feature (the async readers, signing) is mutated against the tests
# that exercise it rather than against none.
all_features = true

# Baseline build timeout multiplier
timeout_multiplier = 2.0
