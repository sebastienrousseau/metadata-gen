# -----------------------------------------------------------------------------
# Metadata Gen - A powerful Rust library for extracting, validating, and processing metadata in YAML, TOML, and JSON formats from any content or data file.
# -----------------------------------------------------------------------------

[package]
name = "metadata-gen"
version = "0.0.8"
edition = "2021"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
description = """
A powerful Rust library for extracting, validating, and processing metadata in YAML, TOML, and JSON formats from any content or data file.
"""
homepage = "https://metadata-gen.com/"
documentation = "https://doc.metadata-gen.com/metadata_gen/"
repository = "https://github.com/sebastienrousseau/metadata-gen"
readme = "README.md"

# -----------------------------------------------------------------------------
# Crate Configuration
# -----------------------------------------------------------------------------
categories = [
    "parsing",
    "text-processing",
    "web-programming",
    "data-structures",
]

keywords = ["frontmatter", "metadata", "seo", "opengraph", "static-site"]

[lib]
name = "metadata_gen"
path = "src/lib.rs"

# -----------------------------------------------------------------------------
# Dependencies
# -----------------------------------------------------------------------------

[dependencies]
# Dependencies required for building and running the project.
#
# Notes:
# - `noyalib` is first-party (same maintainer) and pinned strictly until
#   it reaches 1.0 so a 0.0.x patch upstream cannot silently break every
#   downstream consumer of `metadata-gen`. See ADR-0004.
# - `tokio` is optional (feature `tokio`) and trimmed to `fs` + `io-util`
#   for the file helpers in `metadata_gen::tokio`. We do not need `net`,
#   `signal`, `process`, or `parking_lot`.
# Every dependency is `default-features = false`; the crate's own `std`
# feature switches their std support back on, so a `no_std + alloc`
# build (`default-features = false, features = ["yaml"]`) gets a tree
# that never names `std`.
memchr = { version = "2.7", default-features = false }
noyalib = { version = "=0.0.56", default-features = false, optional = true }
quick-xml = { version = "0.42", optional = true }
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"], optional = true }
thiserror = { version = "2.0", default-features = false }
time = { version = "0.3", default-features = false, features = ["parsing"] }
tokio = { version = "1.50", default-features = false, features = ["fs", "io-util"], optional = true }
toml = { version = "1.1", default-features = false, features = ["parse", "display", "serde"], optional = true }

# -----------------------------------------------------------------------------
# Build Dependencies
# -----------------------------------------------------------------------------


# -----------------------------------------------------------------------------
# Development Dependencies
# -----------------------------------------------------------------------------

[dev-dependencies]
# Dependencies required for development, testing, and documentation.
assert_fs = "1.1"
criterion = "0.8"
predicates = "3.1"
# `tempfile` is only needed for tests + examples; not part of the runtime
# dependency surface.
tempfile = "3.27"
# Doc-tests / examples that use `#[tokio::main]` need the full Tokio runtime
# bundle, but library consumers must not pay for that.
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
regex = "1.12"
proptest = { version = "1.6", default-features = false, features = ["std", "bit-set"] }

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"
tokio = { version = "1.50", features = ["sync"] }

# -----------------------------------------------------------------------------
# Examples
# -----------------------------------------------------------------------------

[[example]]
name = "error_example"
path = "examples/error_example.rs"
required-features = ["std", "yaml", "toml", "json", "html", "tokio"]

[[example]]
name = "lib_example"
path = "examples/lib_example.rs"
required-features = ["std", "yaml", "toml", "json", "html", "tokio"]

[[example]]
name = "metadata_example"
path = "examples/metadata_example.rs"
required-features = ["std", "yaml", "toml", "json", "html"]

[[example]]
name = "metatags_example"
path = "examples/metatags_example.rs"
required-features = ["std", "yaml", "toml", "json", "html"]

[[example]]
name = "utils_example"
path = "examples/utils_example.rs"
required-features = ["std", "yaml", "toml", "json", "html", "tokio"]


# -----------------------------------------------------------------------------
# Criterion Benchmark
# -----------------------------------------------------------------------------

[[bench]]
name = "metadata_benchmark"
harness = false
required-features = ["std", "yaml", "toml", "json", "html"]

[profile.bench]
# Match release codegen so reported numbers reflect what users will see.
# `line-tables-only` keeps just enough debug info for flamegraphs without
# defeating the inliner. See the v0.0.5 bench-profile correction.
debug = "line-tables-only"
lto = true
codegen-units = 1
opt-level = 3

# -----------------------------------------------------------------------------
# Features
# -----------------------------------------------------------------------------

[features]
# Every format and integration is a feature so a consumer pays only for
# what it parses. The default set keeps everything 0.0.7 offered, the
# Tokio file helper included; `default-features = false` gives a
# `no_std + alloc` core. See docs/adr/0005-feature-flags-and-no-std.md.
default = ["std", "yaml", "toml", "json", "html", "tokio"]
# Standard library: file helpers, `std::io::Error`, `HashMap`-backed maps.
# Without it the crate is `no_std + alloc` and `MetadataMap` is a `BTreeMap`.
std = [
    "memchr/std",
    "serde/std",
    "serde_json?/std",
    "toml?/std",
    "noyalib?/std",
    "time/std",
    "thiserror/std",
]
# Front-matter formats. At least one is needed for `extract_metadata` to
# ever succeed; a format that is not compiled in is reported as
# `MetadataError::UnsupportedFormatError`.
yaml = ["dep:noyalib"]
toml = ["dep:toml"]
json = ["dep:serde_json"]
# `extract_meta_tags`: the streaming `<meta>` scanner (needs std for quick-xml).
html = ["std", "dep:quick-xml"]
# `metadata_gen::tokio`: async file helpers on the Tokio runtime.
tokio = ["std", "dep:tokio"]

# -----------------------------------------------------------------------------
# Release Profile
# -----------------------------------------------------------------------------

[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
panic = 'unwind'
rpath = false
strip = false

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = true
opt-level = 3
overflow-checks = false
panic = "abort"
rpath = false
strip = "symbols"

[profile.test]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
rpath = false
strip = false

# -----------------------------------------------------------------------------
# Documentation Configuration
# -----------------------------------------------------------------------------

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(kani)'] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
