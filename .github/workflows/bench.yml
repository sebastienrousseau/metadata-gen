# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Benchmark regression gate (#49, #36).
#
# `regression` runs on every pull request and needs no account: it runs
# the Criterion suite on the base commit, saves it as a baseline, runs
# it again on the change and fails when any benchmark is slower than
# the threshold at the lower bound of its confidence interval
# (scripts/bench_compare.py). Both runs share one runner and the same
# benchmark code: the baseline builds the change's benches/ against the
# base commit's library (scripts/bench_overlay.py), so a pull request
# that rewrites a benchmark is not reported as a library regression.
#
# `codspeed` adds CodSpeed's instrumented, noise-free measurements once
# the repository is registered at codspeed.io and the CODSPEED_TOKEN
# secret exists. Until then it reports that it was skipped and passes.

name: Bench

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  regression:
    name: noyalib bisect scratch (never merged)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: sudo apt-get update -q && sudo apt-get install -yq valgrind
      - run: bisect/run5.sh
        env:
          ROUNDS: "20"
          REVS: "n60=v0.0.60 n63=v0.0.63 fix=6c717c8"
