# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Benchmark regression gate (#49, #36). No account or token: it runs
# on every pull request with what the runner has.
#
# The gate is the instruction count. benches/instructions.rs runs fixed
# workloads; scripts/instruction_compare.py runs each under Valgrind's
# callgrind with the base commit's library and with the change's, and
# fails when the change executes more than 1% more instructions. The
# count does not depend on how busy the shared runner is.
#
# Criterion still measures wall-clock time for every benchmark and its
# table is reported, but it is advisory (warnings, exit 0): timings on
# shared runners moved by 6-15% between two builds of identical
# library code on PRs that changed only workflows (#152, #154, #155,
# #158), more than any threshold worth gating on.
#
# Both runs build the change's benches/ against the base commit's
# library (scripts/bench_overlay.py), so a pull request that rewrites a
# benchmark is not reported as a library regression. Both tables are
# posted to the pull request as one comment that every push updates,
# by bench-comment.yml (see the `Prepare the pull request comment`
# step).

name: Bench

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  regression:
    name: bench regression (instruction-count gate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Both runs write to one place so the second finds the baseline.
      CRITERION_HOME: ${{ github.workspace }}/criterion
      BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      # Valgrind from the runner image's own Ubuntu archive.
      - name: Install Valgrind
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends valgrind
          valgrind --version
      - name: Baseline on the base commit, with the change's benches
        # A bench target that does not build against the base library
        # gets no baseline; the gate lists its benchmarks as new.
        run: |
          set -euo pipefail
          instructions_binary() {
            cargo bench --all-features --bench instructions --no-run --message-format=json < /dev/null |
              jq -r 'select(.reason == "compiler-artifact" and .target.name == "instructions" and .executable != null) | .executable' |
              tail -n 1 | grep .
          }
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          python3 -I scripts/bench_overlay.py "$RUNNER_TEMP/base" > "$RUNNER_TEMP/benches.txt"
          cd "$RUNNER_TEMP/base"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          while read -r bench; do
            if cargo bench --all-features --bench "$bench" --no-run < /dev/null; then
              cargo bench --all-features --bench "$bench" -- --save-baseline base < /dev/null
            else
              echo "::notice::bench target $bench does not build on $BASE_SHA: new, no baseline"
            fi
          done < "$RUNNER_TEMP/benches.txt"
          # The instruction workloads, built now because the change's
          # build below reuses the same target directory.
          if bin="$(instructions_binary)"; then
            cp "$bin" "$RUNNER_TEMP/instructions-base"
          else
            echo "::notice::the instruction workloads do not build on $BASE_SHA: new, no baseline"
          fi
      - name: The change against the baseline
        # Lenient: a benchmark the base commit does not have yet is
        # measured but not compared.
        run: cargo bench --all-features --bench '*' -- --baseline-lenient base
      - name: Criterion timings (advisory)
        run: |
          set -euo pipefail
          mkdir -p bench-comment
          python3 -I scripts/bench_compare.py --threshold 0.05 --criterion-dir "$CRITERION_HOME" --advisory \
            > bench-comment/gate.txt
          cat bench-comment/gate.txt
      - name: Instruction-count gate
        run: |
          set -euo pipefail
          mkdir -p bench-comment
          bin="$(cargo bench --all-features --bench instructions --no-run --message-format=json < /dev/null |
            jq -r 'select(.reason == "compiler-artifact" and .target.name == "instructions" and .executable != null) | .executable' |
            tail -n 1)"
          base=()
          if [ -x "$RUNNER_TEMP/instructions-base" ]; then base=(--base "$RUNNER_TEMP/instructions-base"); fi
          status=0
          python3 -I scripts/instruction_compare.py --head "$bin" "${base[@]}" --threshold 0.01 \
            > bench-comment/instructions.txt || status=$?
          cat bench-comment/instructions.txt
          exit "$status"
      # The table goes to the pull request through bench-comment.yml,
      # which runs on `workflow_run` with `pull-requests: write`; this
      # job keeps `contents: read` and only hands over an artifact, so a
      # fork's pull request gets its comment without its code ever
      # running with a write token.
      - name: Prepare the pull request comment
        if: always() && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p bench-comment
          section() { # section <title> <file>
            echo "### $1"
            echo
            if [ -s "$2" ]; then
              grep -v '^::' "$2" || true
              if grep -q '^::' "$2"; then
                echo
                grep '^::' "$2" | sed 's/^::[a-z]*::/- /'
              fi
            else
              echo 'Not reached; see the run log.'
            fi
            echo
          }
          {
            echo '## Benchmark comparison'
            echo
            section 'Instruction counts (the gate)' bench-comment/instructions.txt
            section 'Criterion timings (advisory)' bench-comment/gate.txt
            echo "Measured on ${HEAD_SHA} against ${BASE_SHA}, one shared runner."
          } > bench-comment/comment.md
          printf '%s\n' "$PR_NUMBER" > bench-comment/pr-number
      - name: Upload the pull request comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-comment
          path: |
            bench-comment/comment.md
            bench-comment/pr-number
          retention-days: 7
      - name: Upload the Criterion reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion
          path: criterion
          retention-days: 30

  escape-compare:
    name: escape_html vs v_htmlescape
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          workspaces: perf/escape-compare
      # Informational: the numbers go to the job summary, nothing is
      # asserted. perf/escape-compare is its own workspace so the SIMD
      # reference crate never enters Cargo.lock.
      - name: Compare on 64 KiB inputs
        working-directory: perf/escape-compare
        run: |
          set -euo pipefail
          cargo bench --bench escape_compare 2>&1 | tee bench.txt
          {
            echo '## escape_html vs v_htmlescape (64 KiB)'
            echo
            echo '```text'
            grep -E '^escape_64KiB|thrpt:' bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
