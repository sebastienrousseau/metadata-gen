# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Flamegraphs of the throughput benchmarks, on demand (#49).
#
# Run from the Actions tab. Each throughput group is profiled under
# `perf` with cargo-flamegraph and its SVG uploaded as the
# `flamegraphs` artifact. The bench profile already keeps
# `debug = "line-tables-only"` (Cargo.toml), which is what resolves
# frames to functions and lines; cargo-flamegraph records with
# `perf record --call-graph dwarf`, which unwinds from `.eh_frame`, so
# the benches are built exactly as the regression gate builds them.
#
# cargo-flamegraph has no prebuilt release binaries and no
# install-action manifest, so install-action builds it from crates.io
# with `cargo install --locked` (`fallback: cargo-install`), never from
# a third-party binary cache.

name: Flamegraph

on:
  workflow_dispatch:
    inputs:
      profile-seconds:
        description: Seconds of profiling per benchmark size
        required: false
        default: "5"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  flamegraph:
    name: flamegraphs (throughput benches)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROFILE_SECONDS: ${{ inputs.profile-seconds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8, installs flamegraph
        with:
          tool: flamegraph@0.6.15
          fallback: cargo-install
      - name: Install perf
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            linux-tools-common "linux-tools-$(uname -r)"
          sudo sysctl -w kernel.perf_event_paranoid=-1
          sudo sysctl -w kernel.kptr_restrict=0
      - name: Profile every throughput group
        run: |
          set -euo pipefail
          case "$PROFILE_SECONDS" in
            '' | *[!0-9]*) echo "::error::profile-seconds must be a whole number"; exit 1 ;;
          esac
          mkdir -p flamegraphs
          for target in extract_metadata extract_and_prepare_metadata \
            process_metadata generate_metatags parse_yaml_block \
            extract_meta_tags escape_html unescape_html; do
            cargo flamegraph --bench metadata_benchmark \
              --features std,yaml,toml,json,html \
              --output "flamegraphs/${target}.svg" \
              -- --bench --profile-time "$PROFILE_SECONDS" \
              "^throughput/${target}/"
          done
          ls -l flamegraphs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flamegraphs
          path: flamegraphs/*.svg
          if-no-files-found: error
          retention-days: 30
