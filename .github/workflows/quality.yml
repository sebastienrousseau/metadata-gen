# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# The gates the repository standard requires that `ci.yml` does not
# cover: coverage threshold, Miri, fuzz corpus replay, docs lint,
# cargo-vet provenance, version consistency, examples and benches.
#
# Kept separate from ci.yml so the shared `rust-ci.yml` call there stays
# a straight upgrade path when the pipelines repo changes.

name: Quality

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage-gate:
    name: coverage (98% lines)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # rust-toolchain.toml pins `stable`, and rustup prefers that file
      # over the toolchain installed below, so without this the job
      # ran on stable.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - name: The nightly toolchain is the one in use
        run: rustc --version | grep -F -- '-nightly'
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8, installs cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      # The threshold and its rationale live in DEVELOPMENT.md. A number
      # chosen once and defended beats chasing 100%.
      - run: cargo llvm-cov --all-features --locked --fail-under-lines 98 --lcov --output-path lcov.info
      # Codecov reports this measurement, the one the gate enforces,
      # under the `llvm-cov` flag; codecov.yml computes its statuses
      # from that flag alone. ci.yml's shared Coverage job also uploads a
      # cargo-tarpaulin report, which counts lines differently (async
      # bodies, multi-line expressions and type aliases read as missed)
      # and stays visible in Codecov without driving the statuses.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: llvm-cov
          fail_ci_if_error: false

  miri:
    name: miri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: miri
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      # The crate forbids unsafe, so this checks the interaction with
      # dependencies that use it internally. Filesystem tests are
      # skipped by #[cfg_attr(miri, ignore)] — isolation forbids open().
      - run: cargo +nightly miri test --lib

  fuzz-replay:
    name: fuzz build + corpus replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          workspaces: fuzz
      # From source, deliberately. The prebuilt binary taiki-e ships is
      # a musl build and mis-infers the fuzz target triple, so it emits
      # sanitized fuzzers for x86_64-unknown-linux-musl and dies on
      # "sanitizer is incompatible with statically linked libc".
      - run: cargo install --locked cargo-fuzz
      # -runs=0 replays the committed inputs without generating new
      # ones: the seeds prove the targets still build and run, and
      # fuzz/regressions/ proves a fixed crash cannot come back.
      - name: Build every target and replay the corpus
        working-directory: fuzz
        run: |
          set -euo pipefail
          cargo +nightly fuzz build
          for target in $(cargo +nightly fuzz list); do
            echo "== $target"
            dirs=("corpus/$target")
            [ -d "regressions/$target" ] && dirs+=("regressions/$target")
            cargo +nightly fuzz run "$target" -- -runs=0 "${dirs[@]}"
          done

  proptest:
    name: proptest property verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      # 10 000 cases per round-trip property and 100 000 for the ASCII
      # escape involution, optimised so the job stays quick. The seed is
      # printed first: rerun a failure with the same PROPTEST_RNG_SEED.
      # A shrunken counterexample is written to
      # tests/test_proptest.proptest-regressions; commit it and it
      # replays first on every later run.
      - name: Properties with a recorded seed
        env:
          PROPTEST_CASES: "10000"
          CARGO_PROFILE_TEST_OPT_LEVEL: "3"
        run: |
          set -euo pipefail
          PROPTEST_RNG_SEED="$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')"
          export PROPTEST_RNG_SEED
          echo "PROPTEST_RNG_SEED=$PROPTEST_RNG_SEED" | tee -a "$GITHUB_STEP_SUMMARY"
          cargo test --test test_proptest -- --nocapture

  loom:
    name: loom concurrency check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - run: RUSTFLAGS="--cfg loom" cargo test --test loom_smoke --release

  docs-lint:
    name: docs lint (markdownlint, codespell, REUSE)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: npx --yes markdownlint-cli2 "**/*.md" "!target/**" "!fuzz/target/**"
      - run: uvx codespell
      - run: uvx --with chardet reuse lint

  cargo-vet:
    name: cargo-vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Pinned by SHA, the action cannot read the toolchain from the
          # ref, so it is named here.
          toolchain: stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      # Pinned: releases before 0.10 reject a `[[trusted.*]]` entry that
      # names a `trusted-publisher` instead of a `user-id`, which is how
      # a crates.io Trusted Publishing release is attested.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8, installs cargo-vet
        with:
          tool: cargo-vet@0.10.2
      - run: cargo vet --locked
      # Exemptions may shrink, never grow. A new dependency arrives with
      # an audit or a trust entry, not with another exemption.
      - name: Exemption ratchet
        run: |
          set -euo pipefail
          baseline="$(tr -d '[:space:]' < supply-chain/exemptions-baseline.txt)"
          # Count from the JSON report: the text summary omits
          # "N exempted" when there are none, so grepping it fails at 0.
          current="$(cargo vet --locked --output-format json | jq -e '(.vetted_with_exemptions | arrays | length) // error("no vetted_with_exemptions in cargo vet JSON")')"
          echo "exempted: $current (baseline $baseline)"
          if [ "$current" -gt "$baseline" ]; then
            echo "::error::exemptions grew from $baseline to $current"
            exit 1
          fi

  release-hygiene:
    name: versions, examples, benches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Pinned by SHA, the action cannot read the toolchain from the
          # ref, so it is named here.
          toolchain: stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      # Every version-bearing file must agree with Cargo.toml before a
      # tag exists, not after the release workflow rejects the tag.
      - run: ./scripts/verify-release-versions.sh
      # Docs that run: an example that stops working fails the build.
      - run: make examples
      # Benches stay compiling and runnable; no measurement is asserted.
      - run: cargo bench --all-features -- --test
      - name: rustdoc with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked

  msrv:
    name: MSRV (1.89.0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # rust-toolchain.toml pins `stable`, and rustup prefers that file
      # over the toolchain installed below, so without this the job
      # built on stable and proved nothing about the floor.
      RUSTUP_TOOLCHAIN: 1.89.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # `rust-version` in Cargo.toml. A dependency or syntax that
          # needs a newer compiler fails here, not on a user's machine.
          toolchain: 1.89.0
      - name: The MSRV toolchain is the one in use
        run: rustc --version | grep -F 'rustc 1.89.0 '
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - run: cargo check --all-features --all-targets --locked

  semver-checks:
    name: API breakage (cargo-semver-checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8, installs cargo-semver-checks
        with:
          tool: cargo-semver-checks
      # Compares the public API against the last crates.io release. While
      # the crate is 0.0.x every release is a major bump under semver, so
      # today this proves the version moved; the lints bite from 0.1.0.
      - run: cargo semver-checks check-release --all-features

  feature-powerset:
    name: feature powerset (cargo-hack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8, installs cargo-hack
        with:
          tool: cargo-hack
      - run: cargo hack check --feature-powerset --all-targets --locked

  no-std:
    name: no_std + alloc (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      # A target with no `std` at all: the build fails if anything in the
      # tree names `std` without the `std` feature (ADR-0005).
      - run: cargo build --lib --locked --no-default-features --features yaml,toml,json --target thumbv7em-none-eabihf
      # A format that is compiled out must report UnsupportedFormatError.
      - run: cargo test --lib --locked --no-default-features --features yaml

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: cargo-cyclonedx@0.5.9
      # The SBOM the release attaches must list every crate of the
      # default build with its cargo purl (issue #28).
      - run: python3 -I scripts/check-sbom.py

  wasi-component:
    name: WASI 0.2 component (wasm32-wasip2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          workspaces: wasi
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8, installs wasmtime and wasm-tools
        with:
          tool: wasmtime@50.0.2,wasm-tools@1.261.0
      # Builds the component, validates it, checks the 1 MiB budget, and
      # calls every export under wasmtime, comparing each result with the
      # native build's output for the same input (ADR-0009).
      - run: python3 -I wasi/check.py

  deploy-cloudflare-workers:
    # The Cloudflare Workers sample (#63), built the way
    # docs/deploy/cloudflare-workers.md says: npm ci, npm run build (the
    # component as in wasi-component, then jco transpile), and a
    # wrangler dry run that bundles the Worker. No account, no secrets,
    # nothing is deployed.
    name: deploy sample (Cloudflare Workers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: examples/deploy/cloudflare-workers
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          workspaces: wasi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm run build
      - run: npx --no-install wrangler deploy --dry-run --outdir dist

  embedded:
    name: embedded (${{ matrix.target }}, ${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Arm Cortex-M4F: every format, and YAML alone for the size
          # budget #61 sets on a yaml-only build.
          - target: thumbv7em-none-eabihf
            features: yaml,toml,json
          - target: thumbv7em-none-eabihf
            features: yaml
          # RISC-V with atomics: every format.
          - target: riscv32imac-unknown-none-elf
            features: yaml,toml,json
          # RISC-V without atomic read-modify-write: `alloc::sync` does
          # not exist there, and both `noyalib` and `toml` use `Arc`, so
          # only JSON builds. This row proves the crate itself needs no
          # atomics.
          - target: riscv32imc-unknown-none-elf
            features: json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: llvm-tools
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          key: ${{ matrix.target }}
          workspaces: |
            . -> target
            embedded/size-probe -> target
      # Without `std` the build fails on anything that names it.
      - name: Build
        run: cargo build --lib --release --locked --no-default-features --features "${{ matrix.features }}" --target "${{ matrix.target }}"
      # The crate's own code size, optimised for size without LTO, as
      # llvm-size reports the rlib's text + data + bss. Dependencies are
      # measured separately because a linker keeps only what is called.
      - name: Object size
        run: ./scripts/embedded_size.sh "${{ matrix.target }}" "${{ matrix.features }}" | tee -a "$GITHUB_STEP_SUMMARY"
      # What a yaml-only build adds to a linked no_std firmware image
      # (LTO, --gc-sections, opt-level s): flash, not object code.
      # Reported, not gated: it measures over the 50 KB #61 asks for.
      - name: Firmware size
        if: matrix.features == 'yaml'
        run: ./scripts/embedded_firmware_size.sh "${{ matrix.target }}" | tee -a "$GITHUB_STEP_SUMMARY"

  complexity:
    name: complexity (per-function ceilings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3.0.8
        with:
          tool: rust-code-analysis-cli@0.0.25
      # Ceilings and the (empty) baseline are in scripts/complexity_check.py
      # and complexity-baseline.txt. The baseline may only shrink.
      - run: python3 -I scripts/complexity_check.py

  links:
    name: links (lychee)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml './**/*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}
