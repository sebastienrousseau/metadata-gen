name: CI
on:
  push:
    branches: [main, feat/**]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; a job that needs more says so itself.
permissions:
  contents: read

jobs:
  ci:
    # Pinned to a SHA (immutable) rather than @main (mutable). Bump
    # deliberately when upstream rust-ci.yml changes are worth absorbing.
    uses: sebastienrousseau/pipelines/.github/workflows/rust-ci.yml@83114142d0a14e9c6302a9ba9e716a0cc53e4e01 # v0.0.3
    with:
      rust-version: 'stable'
      run-coverage: true
      # Local cargo-audit + cargo-deny jobs supersede the reusable audit.
      run-audit: false
      # Validate the README's "Linux, macOS, Windows" claim. Matrix is
      # macos-latest + windows-latest; needs the linux check to pass.
      run-cross-platform: true
      # `coverage-exclude: 'crates/*'` removed — no `crates/` directory
      # exists in the repo since the v0.0.3 noyalib migration.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security:
    uses: sebastienrousseau/pipelines/.github/workflows/security.yml@3f9978aba68e59da1bd5a58d12fbaf142679fe5f # v0.0.4
    # The reusable workflow's CodeQL job uploads SARIF results.
    permissions:
      contents: read
      security-events: write
    with:
      language: rust
      fail-on-vulnerability: true

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check all
          arguments: --all-features

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
      - run: cargo install --locked cargo-audit
      - run: cargo audit --deny warnings

  # Docs are built and deployed by .github/workflows/docs.yml on push to main.
  # The previous external `pipelines/docs.yml` reusable workflow wrote to a
  # gh-pages branch; the new local workflow uses the Pages-from-Actions deploy.
