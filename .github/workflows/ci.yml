name: CI
on:
  push:
    branches: [main, feat/**]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Pinned to a SHA (immutable) rather than @main (mutable). Bump
    # deliberately when upstream rust-ci.yml changes are worth absorbing.
    uses: sebastienrousseau/pipelines/.github/workflows/rust-ci.yml@7061363af0a1da9d60c5901bd2874ac83ff7e34e # tracks main 2026-06-28
    with:
      rust-version: 'stable'
      run-coverage: true
      # Local cargo-audit + cargo-deny jobs supersede the reusable audit.
      run-audit: false
      # Validate the README's "Linux, macOS, Windows" claim. Matrix is
      # macos-latest + windows-latest; needs the linux check to pass.
      run-cross-platform: true
      # `coverage-exclude: 'crates/*'` removed — no `crates/` directory
      # exists in the repo since the v0.0.3 noyalib migration.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  security:
    uses: sebastienrousseau/pipelines/.github/workflows/security.yml@7061363af0a1da9d60c5901bd2874ac83ff7e34e # tracks main 2026-06-28
    with:
      language: rust
      fail-on-vulnerability: true

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
        with:
          command: check all
          arguments: --all-features

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo install --locked cargo-audit
      - run: cargo audit --deny warnings

  # Docs are built and deployed by .github/workflows/docs.yml on push to main.
  # The previous external `pipelines/docs.yml` reusable workflow wrote to a
  # gh-pages branch; the new local workflow uses the Pages-from-Actions deploy.
