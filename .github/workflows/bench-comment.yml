# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Posts the Bench workflow's comparison table to its pull request (#49).
#
# The regression job runs the pull request's code with a read-only
# token and uploads the table and the pull request number as the
# `bench-comment` artifact. This workflow runs afterwards from the
# default branch's copy of this file, never checks anything out, and
# treats the artifact as data: the number must be a number, and that
# pull request's head must still be the commit the Bench run measured.
# It then updates one comment, found by the marker on its first line,
# instead of adding one per push.
#
# `workflow_run` only fires for workflow files on the default branch,
# so this starts commenting once it is merged.

name: Bench comment

on:
  workflow_run:
    workflows: [Bench]
    types: [completed]

permissions: {}

jobs:
  comment:
    name: sticky benchmark comment
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-comment
          path: ${{ runner.temp }}/bench-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Create or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ARTIFACT: ${{ runner.temp }}/bench-comment
        run: |
          set -euo pipefail
          pr="$(head -c 16 "$ARTIFACT/pr-number" | tr -d '[:space:]')"
          case "$pr" in
            '' | *[!0-9]*) echo "::error::pr-number is not a number"; exit 1 ;;
          esac
          head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq .head.sha)"
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "::notice::#${pr} is at ${head}, not the measured ${HEAD_SHA}; not commenting"
            exit 0
          fi
          marker='<!-- metadata-gen:bench-comparison -->'
          body="$RUNNER_TEMP/body.md"
          { echo "$marker"; head -c 60000 "$ARTIFACT/comment.md"; } > "$body"
          id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" \
            | head -n 1)"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F "body=@${body}" > /dev/null
            echo "updated comment ${id} on #${pr}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${pr}/comments" -F "body=@${body}" > /dev/null
            echo "created a comment on #${pr}"
          fi
